# Auto-wire Project Tools entry (User Interface → site tools reference).
# Re-install the plugin or merge this into `config/studio/ui.xml` if you manage UI config manually.
installation:
  - type: preview-app
    parentXpath: //reference[@id='craftercms.siteTools']
    elementXpath: //widget[@id='org.rd.plugin.uigoodies.CrossSiteContentTypeCopy']
    element:
      name: tools
      children:
        - name: tool
          children:
            - name: title
              attributes:
                - name: id
                  value: uigoodies.crossSiteContentTypeCopy.title
                - name: defaultMessage
                  value: Content Type Copy
            - name: icon
              attributes:
                - name: id
                  value: "@mui/icons-material/FileCopyOutlined"
            - name: url
              value: uigoodies-cross-site-content-types
            - name: widget
              attributes:
                - name: id
                  value: org.rd.plugin.uigoodies.CrossSiteContentTypeCopy
              children:
                - name: plugin
                  attributes:
                    - name: id
                      value: org.rd.plugin.uigoodies
                    - name: type
                      value: apps
                    - name: name
                      value: uigoodies
                    - name: file
                      value: index.js
  - type: preview-app
    parentXpath: //reference[@id='craftercms.siteTools']
    elementXpath: //widget[@id='org.rd.plugin.uigoodies.OpenSearchPlayground']
    element:
      name: tools
      children:
        - name: tool
          children:
            - name: title
              attributes:
                - name: id
                  value: uigoodies.openSearchPlayground.title
                - name: defaultMessage
                  value: OpenSearch
            - name: icon
              attributes:
                - name: id
                  value: "@mui/icons-material/SearchRounded"
            - name: url
              value: uigoodies-opensearch-playground
            - name: widget
              attributes:
                - name: id
                  value: org.rd.plugin.uigoodies.OpenSearchPlayground
              children:
                - name: plugin
                  attributes:
                    - name: id
                      value: org.rd.plugin.uigoodies
                    - name: type
                      value: apps
                    - name: name
                      value: uigoodies
                    - name: file
                      value: index.js
  - type: preview-app
    parentXpath: //reference[@id='craftercms.siteTools']
    elementXpath: //widget[@id='org.rd.plugin.uigoodies.LogTail']
    element:
      name: tools
      children:
        - name: tool
          children:
            - name: title
              attributes:
                - name: id
                  value: uigoodies.logTail.title
                - name: defaultMessage
                  value: Log Tail
            - name: icon
              attributes:
                - name: id
                  value: "@mui/icons-material/TerminalRounded"
            - name: url
              value: uigoodies-log-tail
            - name: widget
              attributes:
                - name: id
                  value: org.rd.plugin.uigoodies.LogTail
              children:
                - name: plugin
                  attributes:
                    - name: id
                      value: org.rd.plugin.uigoodies
                    - name: type
                      value: apps
                    - name: name
                      value: uigoodies
                    - name: file
                      value: index.js
                - name: configuration
                  children:
                    - name: files
