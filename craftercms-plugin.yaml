# Auto-wire Project Tools entry (User Interface → site tools reference).
# Re-install the plugin or merge this into `config/studio/ui.xml` if you manage UI config manually.
installation:
  - type: preview-app
    parentXpath: //reference[@id='craftercms.siteTools']
    elementXpath: //reference[@id='craftercms.siteTools']//widget[@id='org.rd.plugin.uigoodies.CrossSiteContentCopy']
    element:
      name: tools
      children:
        - name: tool
          children:
            - name: title
              attributes:
                - name: id
                  value: uigoodies.crossSiteContentCopy.title
                - name: defaultMessage
                  value: Cross Site Copy
            - name: icon
              attributes:
                - name: id
                  value: "@mui/icons-material/ContentCopyOutlined"
            - name: url
              value: uigoodies-cross-site-content-copy
            - name: widget
              attributes:
                - name: id
                  value: org.rd.plugin.uigoodies.CrossSiteContentCopy
              children:
                - name: plugin
                  attributes:
                    - name: id
                      value: org.rd.plugin.uigoodies
                    - name: type
                      value: apps
                    - name: name
                      value: uigoodies
                    - name: file
                      value: index.js
  - type: preview-app
    parentXpath: //reference[@id='craftercms.siteTools']
    elementXpath: //reference[@id='craftercms.siteTools']//widget[@id='org.rd.plugin.uigoodies.TranslationConfigTools']
    element:
      name: tools
      children:
        - name: tool
          children:
            - name: title
              attributes:
                - name: id
                  value: uigoodies.translationConfigTools.title
                - name: defaultMessage
                  value: Translation
            - name: icon
              attributes:
                - name: id
                  value: "@mui/icons-material/TranslateRounded"
            - name: url
              value: uigoodies-translation-config
            - name: widget
              attributes:
                - name: id
                  value: org.rd.plugin.uigoodies.TranslationConfigTools
              children:
                - name: plugin
                  attributes:
                    - name: id
                      value: org.rd.plugin.uigoodies
                    - name: type
                      value: apps
                    - name: name
                      value: uigoodies
                    - name: file
                      value: index.js
  - type: preview-app
    parentXpath: //reference[@id='craftercms.siteTools']
    elementXpath: //reference[@id='craftercms.siteTools']//widget[@id='org.rd.plugin.uigoodies.UIGoodiesAdmin']
    element:
      name: tools
      children:
        - name: tool
          children:
            - name: title
              attributes:
                - name: id
                  value: uigoodies.uigoodiesAdmin.title
                - name: defaultMessage
                  value: UI Goodies
            - name: icon
              attributes:
                - name: id
                  value: "@mui/icons-material/SettingsSuggestOutlined"
            - name: url
              value: uigoodies-admin
            - name: widget
              attributes:
                - name: id
                  value: org.rd.plugin.uigoodies.UIGoodiesAdmin
              children:
                - name: plugin
                  attributes:
                    - name: id
                      value: org.rd.plugin.uigoodies
                    - name: type
                      value: apps
                    - name: name
                      value: uigoodies
                    - name: file
                      value: index.js
  # Preview toolbar — Translation (locale copy)
  - type: preview-app
    elementXpath: //widget[@id='org.rd.plugin.uigoodies.openTranslationToolbarButton']
    parentXpath: //widget[@id='craftercms.components.PreviewToolbar']
    element:
      name: configuration
      children:
        - name: rightSection
          children:
            - name: widgets
              children:
                - name: widget
                  attributes:
                    - name: id
                      value: org.rd.plugin.uigoodies.openTranslationToolbarButton
                  children:
                    - name: plugin
                      attributes:
                        - name: id
                          value: org.rd.plugin.uigoodies
                        - name: site
                          value: "{site}"
                        - name: type
                          value: apps
                        - name: name
                          value: uigoodies
                        - name: file
                          value: index.js
                    - name: configuration
                      children:
                        - name: title
                          value: Add to Scope
                        - name: tooltip
                          value: "Translation — pick a locale to add this page under (mirrored path)"
                        - name: useIcon
                          value: "false"
                        - name: useIconWithText
                          value: "true"
                        - name: dialogTitle
                          value: Translation
                        - name: icon
                          attributes:
                            - name: id
                              value: "@mui/icons-material/TranslateRounded"
  # Link check + WCAG toolbar widgets are NOT installed by default.
  # Opt in via: INSTALL_LINK_CHECK_TOOLBAR=1 ./scripts/install-plugin.sh <siteId>
  # Fragment: authoring/config/studio/ui-link-check-toolbar.append.xml
  - type: form-control
    elementXpath: //control/plugin[pluginId='org.rd.plugin.uigoodies' and name='custom-locale']
    element:
      name: control
      children:
        - name: plugin
          children:
            - name: pluginId
              value: org.rd.plugin.uigoodies
            - name: type
              value: control
            - name: name
              value: custom-locale
            - name: filename
              value: main.js
        - name: icon
          children:
            - name: class
              value: fa-language
  - type: form-control
    elementXpath: //control/plugin[pluginId='org.rd.plugin.uigoodies' and name='translation-versions']
    element:
      name: control
      children:
        - name: plugin
          children:
            - name: pluginId
              value: org.rd.plugin.uigoodies
            - name: type
              value: control
            - name: name
              value: translation-versions
            - name: filename
              value: main.js
        - name: icon
          children:
            - name: class
              value: fa-globe
